name: Sincronizza Calendari UniSR

on:
  schedule:
    - cron: '0 5,17 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui Scraper e genera feed .ics
        run: |
          python scraper.py

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatti di build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Esegui Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
