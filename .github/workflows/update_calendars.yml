name: Sincronizza Calendari UniSR

on:
  schedule:
    # Esegue alle 16:30 UTC (17:30 ora italiana) per cutover programmato e alle 05:00 e 17:00 UTC
    - cron: '30 16 * * *'
    - cron: '0 5,17 * * *'
  workflow_dispatch: # Permette di avviare la sincronizzazione manualmente con un clic su GitHub
  push:
    branches:
      - main
      - master

# Permessi necessari per il deploy automatico su GitHub Pages e salvataggio modifiche
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui Scraper e genera feed .ics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/scraper.py

      - name: Salva aggiornamenti e stato su GitHub
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ src/watched_state.json config/active_mode.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sincronizzazione automatica calendari e stato corsi [skip ci]" && git push)

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatti di build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Esegui Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
